model_artifact_id: ""
dataset_artifact_id: ""
split_artifact_id: ""
split_name: test
batch_size: 8
device: auto
num_bins_x: 60
num_bins_y: 60
smoothing_sigma: 0.3
min_occupancy: 1.0e-6
place_field_threshold_fraction: 0.2
rate_map_panel_top_k: 128
rate_map_panel_show_all_units: false
rate_map_grid_top_k: 128
rate_map_grid_show_all_units: false
decode_nonlinear_enabled: true
example_episode_index: -1
example_episode_random_seed: null
example_episode_top_k: 0
place_field_overlay_max_cells: 20
place_field_overlay_kwinners_k_fraction: null
place_field_overlay_frame_duration: 0.5
manifold_metric: cosine
dataset_coverage_extra_splits: [train, validation, test]
max_cost_tier: standard
targets:
  encoder_place_cells:
    source: encoder.place_codes
    enabled: true
    modules:
      - dataset_coverage
      - rate_map_fields
      - rate_map_reliability
      - within_heading_reliability
      - rate_map_bin_consistency
      - rate_map_split_half
      - rate_map_episode_correlation
      - rate_map_coding_purity
      - rate_map_panel
      - rate_map_grid
      - rate_map_extra_reliability_panels
      - population_coverage
      - field_stability_metrics
      - field_stability_summary
      - field_stability_trajectories
      - spatial_info
      - directionality
      - selectivity_partition
      - spatial_code_type
      - effective_dimensionality
      - cognitive_map_geometry
      - transition_geometry_graph
      - transition_geometry_alignment
      - transition_geometry_panel
      - head_direction_tuning
      - sparsity
      - redundancy_metrics
      - decode_xy
      - topology_umap_steps
      - topology_umap_pooled
      - topology_mds_pooled
      - topology_isomap_pooled
      - neighborhood_preservation
      - confounds
      - place_field_detection
      - place_field_overlay
  predictor_place_cells:
    source: predictor.place_codes
    enabled: true
    modules:
      - rate_map_fields
      - rate_map_reliability
      - within_heading_reliability
      - rate_map_bin_consistency
      - rate_map_split_half
      - rate_map_episode_correlation
      - rate_map_coding_purity
      - rate_map_panel
      - rate_map_grid
      - rate_map_extra_reliability_panels
      - population_coverage
      - field_stability_metrics
      - field_stability_summary
      - field_stability_trajectories
      - spatial_info
      - directionality
      - head_direction_tuning
      - sparsity
      - redundancy_metrics
      - decode_xy
      - topology_umap_steps
      - topology_umap_pooled
      - topology_mds_pooled
      - topology_isomap_pooled
      - neighborhood_preservation
      - confounds
      - place_field_overlay
  encoder_pre_sparsifier:
    source: encoder.pre_sparsifier
    enabled: true
    modules:
      - rate_map_fields
      - rate_map_reliability
      - within_heading_reliability
      - rate_map_bin_consistency
      - rate_map_split_half
      - rate_map_episode_correlation
      - rate_map_coding_purity
      - rate_map_panel
      - rate_map_grid
      - gridness
      - population_coverage
      - field_stability_metrics
      - field_stability_summary
      - field_stability_trajectories
      - spatial_info
      - directionality
      - selectivity_partition
      - spatial_code_type
      - head_direction_tuning
      - sparsity
      - redundancy_metrics
      - decode_xy
      - topology_umap_steps
      - topology_umap_pooled
      - topology_mds_pooled
      - topology_isomap_pooled
      - neighborhood_preservation
      - confounds
comparative:
  combined_example_episode:
    module: combined_episode_dynamics
    enabled: true
    example_episode_index: -1
    example_episode_random_seed: null
    example_episode_top_k: 0
    inputs:
      - {label: encoder_place_cells, source: encoder.place_codes}
      - {label: predictor_place_cells, source: predictor.place_codes}
      - {label: encoder_hidden_state, source: encoder.hidden_state}
      - {label: predictor_hidden_state, source: predictor.hidden_state}
