split_name: validation
batch_size: 16
num_bins_x: 32
num_bins_y: 32
smoothing_sigma: 0.35
rate_map_panel_emit_thresholded_reliability_figure: false
rate_map_panel_emit_quantile_thresholded_reliability_figure: false
rate_map_panel_top_k: 24
rate_map_grid_top_k: 24
decode_max_samples: 32768
umap_max_points: 1024
umap_n_neighbors: 15
umap_pool_num_bins_x: 12
umap_pool_num_bins_y: 12
umap_trustworthiness_neighbors: 8
dataset_coverage_extra_splits: [train, validation, test]
targets:
  encoder_place_cells:
    source: encoder.place_codes
    enabled: true
    modules:
      - dataset_coverage
      - rate_map_fields
      - rate_map_reliability
      - rate_map_bin_consistency
      - rate_map_split_half
      - rate_map_panel
      - population_coverage
      - spatial_info
      - decode_xy
      - topology_umap_pooled
      - effective_dimensionality
      - place_field_overlay
  predictor_place_cells:
    source: predictor.place_codes
    enabled: false
    modules: []
  encoder_hidden_state:
    source: encoder.hidden_state
    enabled: false
    modules: []
  predictor_hidden_state:
    source: predictor.hidden_state
    enabled: false
    modules: []
  encoder_hidden_state_layer_0:
    source: encoder.hidden_state_layer_0
    enabled: false
    modules: []
  encoder_hidden_state_layer_1:
    source: encoder.hidden_state_layer_1
    enabled: false
    modules: []
  encoder_hidden_state_layer_2:
    source: encoder.hidden_state_layer_2
    enabled: false
    modules: []
  predictor_hidden_state_layer_0:
    source: predictor.hidden_state_layer_0
    enabled: false
    modules: []
  predictor_hidden_state_layer_1:
    source: predictor.hidden_state_layer_1
    enabled: false
    modules: []
comparative:
  combined_example_episode:
    module: combined_episode_dynamics
    enabled: false
    inputs: []
