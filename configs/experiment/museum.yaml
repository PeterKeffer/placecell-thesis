defaults:
  - {environment: jaxenstein_museum}
  - {collection: jaxenstein_vectorized}
  - {dataset: default}
  - {splits: episode_random}
  - {vision: autoencoder_64}
  - {spatial_model: lstm_gru_kwinners}
  - {evaluation: default}
  - {analysis: standard}
  - {tracking: local}
  - {launcher: local}

name: museum

seed:
  collection_seed: 42
  split_seed: 42
  training_seed: 42

policies:
  artifact_reuse: reuse_if_config_match

environment:
  episode_length: 2048

collection:
  episodes: 8192
  episode_length: 2048
  num_parallel_envs: 256

vision:
  epochs: 16
  batch_size: 256
  max_episodes: 0

evaluation:
  eval_every_n_epochs: 8

analysis:
  smoothing_sigma: 0.0

tracking:
  study_name: jaxenstein_museum

