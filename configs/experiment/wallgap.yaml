defaults:
  - {environment: miniworld_wallgap_asym_large}
  - {collection: default}
  - {dataset: default}
  - {splits: episode_random}
  - {vision: autoencoder_64}
  - {spatial_model: lstm_gru_kwinners}
  - {evaluation: default}
  - {analysis: standard}
  - {tracking: local}
  - {launcher: local}

name: wallgap

seed:
  collection_seed: 42
  split_seed: 42
  training_seed: 42

policies:
  artifact_reuse: reuse_if_config_match

environment:
  episode_length: 2048
  env_kwargs:
    forward_step: 0.26
    turn_step: 20

collection:
  episodes: 8192
  episode_length: 2048
  action_probabilities:
    turn_left: 0.30
    turn_right: 0.30
    move_forward: 0.40
  spawn_regions:
    - courtyard_north
    - courtyard_south
    - corridor_indoor
    - woodplank_yard
    - concrete_yard

dataset:
  canonicality_policy: latent_canonical

vision:
  epochs: 16
  batch_size: 256
  max_episodes: 0
  max_frames_per_episode: 128
  data_loader_num_workers: 8

evaluation:
  eval_every_n_epochs: 8
  sources:
    - encoder.place_codes
    - predictor.place_codes
    - encoder.hidden_state
    - encoder.pre_sparsifier
    - predictor.hidden_state

analysis:
  smoothing_sigma: 0.0
  per_episode_smoothing_sigma: 0.0
  max_cost_tier: heavy
  targets:
    encoder_place_cells:
      modules:
        - dataset_coverage
        - rate_map_fields
        - rate_map_reliability
        - within_heading_reliability
        - rate_map_bin_consistency
        - rate_map_split_half
        - rate_map_episode_correlation
        - rate_map_coding_purity
        - rate_map_panel
        - population_coverage
        - field_stability_metrics
        - field_stability_summary
        - field_stability_trajectories
        - sparsity
        - directionality
        - head_direction_tuning
        - redundancy_metrics
        - decode_xy
        - topology_umap_steps
        - topology_umap_pooled
        - topology_mds_pooled
        - topology_isomap_pooled
        - transition_geometry_graph
        - transition_geometry_alignment
        - transition_geometry_panel
        - effective_dimensionality
        - cognitive_map_geometry
        - heading_rate_map_overlay
        - per_episode_rate_maps
        - neighborhood_preservation
        - confounds
        - place_field_overlay
    predictor_place_cells:
