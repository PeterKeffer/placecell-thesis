name: wallgap_navigation_ppo
seed: 7

environment:
  env_id: MiniWorld-WallGapAsymLarge-v0
  episode_length: 1024
  env_kwargs:
    spawn_regions: [all]
    render_goal_object: false
    reward_on_goal: true
    terminate_on_goal: true
  randomize_agent_start: true

models:
  place_model_checkpoint: best_primary
  place_representation_source: encoder.place_codes

goal_task:
  candidate_positions_xy:
    - [0.0, 18.0]

observation:
  feature_sources: [place_codes_l2, goal_xy_scaled, heading_sin_cos]

training:
  algorithm: ppo
  total_timesteps: 400000
  learning_rate: 0.00025
  n_steps: 2048
  batch_size: 256
  n_epochs: 8
  gamma: 0.999
  gae_lambda: 0.98
  policy_hidden_sizes: [512, 512, 256]
  n_envs: 6
  device: cpu
  checkpoint_freq: 1000000
  eval_freq: 0
  eval_episodes: 0
  final_eval_episodes: 30
  final_eval_stochastic: false

preview:
  enabled: false
  every_n_episodes: 20
  episodes_per_preview: 1
  max_steps_per_episode: 1024
  save_rgb_gif: false
  save_ae_reconstruction_gif: false
  save_trajectory_summary: false

tracking:
  wandb_mode: offline
  study_name: downstream
  tags: [downstream, ppo]
