architecture: composite
inputs:
  observation_source: latent
  predictor_context_channels: [action, step_displacement, angular_velocity]
  predictor_input_mode: encoder
encoder:
  family: lstm
  layer_sizes: [1024, 1024, 1024]
  dropout: 0.0
  head_activation: none
  normalize_codes: false
  backbone_type: identity
predictor:
  family: gru
  layer_sizes: [512, 512]
  dropout: 0.0
  head_activation: none
  normalize_codes: false
  action_embedding_dim: 32
  backbone_type: identity
sparsifier:
  type: kwinners
  k_fraction: 0.02
  temperature: 0.5
predictor_sparsifier:
  type: none
teacher_student:
  mode: ema_byol
  ema_decay: 0.995
  ema_schedule: constant
  teacher_sees_unmasked: true
objectives:
  prediction_cosine:
    type: prediction_alignment
    weight: 1.0
    loss_type: cosine
  vicreg_encoder:
    type: vicreg
    targets: [encoder.place_codes]
    weight: 1.0
    variance_weight: 5.0
    covariance_weight: 1.0
    minimum_std: 0.1
    covariance_normalization: feature_count
training:
  learning_rate: 0.0003
  weight_decay: 0.00001
  exclude_bias_and_norm_from_weight_decay: true
  gradient_clip_norm: 1.0
  epochs: 128
  code_dim: 512
  batch_size: 32
  num_workers: 8
  optimizer: adam
  lr_schedule: constant
  selection:
    primary_metric: validation.xy_decode_rmse
    primary_mode: min
    tie_break_metric: validation.total_loss
    tie_break_mode: min
    save_best_primary: true
    save_best_validation_loss: true
    save_last: true
